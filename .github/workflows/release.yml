# Builds the release AppImage from the tagged source and attaches it to a GitHub release.
# The package contains NO ROM and nothing generated from it (see landstalker/packaging/make_appimage.py), so no ROM is needed here.
# Usage: git tag v0.4.0 && git push origin v0.4.0      (or "Run workflow" for a test build without a release)
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev squashfs-tools python3-pip

      - name: Fetch genrecomp at the pinned revision (landstalker/vendor.lock)
        run: python3 landstalker/tools/make_vendor.py --fetch

      - name: Build the AppImage
        run: python3 landstalker/packaging/make_appimage.py

      - name: Build the Windows package (cross-built, no ROM needed)
        run: python3 landstalker/packaging/make_windows_zip.py

      - name: Check the Windows package content
        run: |
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile("landstalker/dist/Project-Friday-windows-x64.zip")
          n = set(z.namelist())
          need = ["Project-Friday/Project-Friday.exe", "Project-Friday/firstrun.py", "Project-Friday/python/python.exe",
                  "Project-Friday/vendor/zig/zig.exe", "Project-Friday/vendor/sdl2/bin/SDL2.dll", "Project-Friday/licenses/NOTICE.txt",
                  "Project-Friday/licenses/Genesis-Plus-GX-LICENSE.txt", "Project-Friday/vendor/genrecomp/CMakeLists.txt"]
          missing = [x for x in need if x not in n]
          assert not missing, missing
          assert not any("/src/recomp/" in x for x in n), "generated code must not be in the package"
          print("windows package ok,", len(n), "files")
          PY

      - name: Self-test the AppImage (compiler + SDL2 headers, no ROM needed)
        run: |
          chmod +x landstalker/dist/Project-Friday-x86_64.AppImage
          landstalker/dist/Project-Friday-x86_64.AppImage --appimage-extract-and-run --selftest

      - name: Checksum and release notes
        id: notes
        run: |
          cd landstalker/dist
          SHA=$(sha256sum Project-Friday-x86_64.AppImage | cut -d' ' -f1)
          echo "$SHA  Project-Friday-x86_64.AppImage" > Project-Friday-x86_64.AppImage.sha256
          WSHA=$(sha256sum Project-Friday-windows-x64.zip | cut -d' ' -f1)
          echo "$WSHA  Project-Friday-windows-x64.zip" > Project-Friday-windows-x64.zip.sha256
          VERSION="${GITHUB_REF_NAME:-test}"
          sed -e "s/{VERSION}/${VERSION}/" -e "s/{SHA256}/${SHA}/" -e "s/{WSHA256}/${WSHA}/" ../packaging/release_notes.md > ../../release_notes.md
          ls -l

      - name: Upload as workflow artifact (manual test runs only; a full artifact storage quota must not fail a release)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Project-Friday-AppImage
          path: |
            landstalker/dist/Project-Friday-x86_64.AppImage
            landstalker/dist/Project-Friday-x86_64.AppImage.sha256
            landstalker/dist/Project-Friday-windows-x64.zip
            landstalker/dist/Project-Friday-windows-x64.zip.sha256

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac   # v0.4.0-rc1 -> pre-release
          gh release create "$GITHUB_REF_NAME" $PRE \
            landstalker/dist/Project-Friday-x86_64.AppImage \
            landstalker/dist/Project-Friday-x86_64.AppImage.sha256 \
            landstalker/dist/Project-Friday-windows-x64.zip \
            landstalker/dist/Project-Friday-windows-x64.zip.sha256 \
            --title "Project-Friday ${GITHUB_REF_NAME}" \
            --notes-file release_notes.md \
            --verify-tag
